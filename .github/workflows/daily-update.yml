name: News Update (Every 2h)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Fetch
        run: timeout 600 npm run fetch
        continue-on-error: true

      - name: Process
        run: npm run process

      - name: Build
        run: npm run build

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json public/index.html
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "📰 Update $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
          git push origin HEAD:main
