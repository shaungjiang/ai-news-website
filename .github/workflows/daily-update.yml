name: Daily News Update

on:
  schedule:
    # Runs at 00:00 UTC = 08:00 Beijing time
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write  # Needed to push changes back to repo

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch news from RSS feeds
        run: npm run fetch
        timeout-minutes: 8
        continue-on-error: true  # Individual source failures are OK

      - name: Process and deduplicate
        run: npm run process

      - name: Generate static site
        run: npm run build

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📰 Daily news update"
          file_pattern: 'data/ public/'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
